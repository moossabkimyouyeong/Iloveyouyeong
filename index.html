<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사랑 고백</title>
    <!-- Google Fonts에서 Dancing Script 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0c8d5; /* 부드러운 핑크 배경 */
            font-family: 'Dancing Script', cursive; /* Dancing Script 폰트 */
        }

        .container {
            text-align: center;
            color: #e74c3c; /* 사랑스러운 빨강색 */
            font-size: 5vw; /* 화면 크기에 비례하여 폰트 크기 조정 */
        }

        .container h1 {
            margin: 0;
            animation: fadeIn 3s ease-in-out;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* 작은 화면에서는 텍스트 크기 줄어듦 */
        @media (max-width: 600px) {
            .container {
                font-size: 8vw; /* 작은 화면에서는 더 크게 보이도록 */
            }
        }
    </style>
</head>
