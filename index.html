<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김유영</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .message {
            font-size: 36px;
            color: #e91e63;
            text-align: center;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: scale(0.5);
            animation: appear 2s forwards;
        }
        .heart {
            font-size: 50px;
            color: #ff4081;
        }
        /* 애니메이션 정의 */
        @keyframes appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .message1 { animation-delay: 0s; }
        .message2 { animation-delay: 3s; }
        .message3 { animation-delay: 6s; }
        .message4 { animation-delay: 9s; }
    </style>
</head>
<body>
    <div class="message message1">
        김유영, 나랑 언제나 함께하면 좋겠다!
    </div>
    <div class="message message2">
        너랑 있으면 시간이 너무 빨리 가.
    </div>
    <div class="message message3">
        매 순간이 너무 소중하고 행복해.
    </div>
    <div class="message message4">
        너와 함께라면, 나의 하루는 완벽해.
    </div>
</body>
</html>
