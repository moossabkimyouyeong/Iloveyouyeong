<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김유영 사랑해</title>
    <!-- Google Fonts에서 Dancing Script 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* 기본 스타일 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #ff7e5f, #feb47b); /* 그라디언트 배경 */
            font-family: 'Dancing Script', cursive; /* 폰트 적용 */
        }

        /* 메시지 스타일 */
        h1 {
            font-size: 5rem;
            color: white;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.4); /* 그림자 효과 */
            text-align: center;
            letter-spacing: 2px; /* 글자 간격 */
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.5); /* 배경 반투명 */
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            h1 {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.5rem;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>김유영 사랑해</h1>
</body>
</html>
