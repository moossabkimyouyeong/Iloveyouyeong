<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Ability Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="three-canvas"></canvas>

      <aside class="hud">
        <h1>Hand Ability Lab</h1>
        <div class="current-ability">
          현재 능력: <strong id="abilityName">대기</strong>
        </div>
        <div id="status">준비됨</div>

        <div class="train-buttons">
          <button data-gesture="aka">아카 학습</button>
          <button data-gesture="ao">아오 학습</button>
          <button data-gesture="murasaki">무라사키 학습</button>
          <button data-gesture="domain">영역전개 학습</button>
        </div>
        <button id="clearData" class="danger">학습 데이터 초기화</button>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="main.js"></script>
  </body>
</html>
